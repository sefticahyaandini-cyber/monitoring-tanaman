[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/sensor"
  to = "/.netlify/functions/monitoring"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
